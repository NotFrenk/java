spring.application.name=P20250326_Rubrica2.0

# chiavi per configurare il driver per Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/rubrica2

spring.datasource.username=postgres
spring.datasource.password=postgres

#chiavi per jpa : attivano il tool di autogenerazione delle tabelle
spring.jpa.hibernate.ddl-auto=update

#mostra sul server le istruzioni sql eseguite da Hibernate
spring.jpa.show-sql=true